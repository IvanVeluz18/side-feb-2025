<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 💖</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8c8dc;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            font-size: 32px;
            font-weight: 400;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            color: #000;
            background-color: #ff69b4;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #d63384;
        }
        .image-placeholder {
            width: auto;
            height: 100%;
            max-height: 300px;
            background-color: #fff;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="dnce.gif" alt="catto" class="image-placeholder">
    <h1>I don’t believe in magic, but that yes felt pretty close to it.</h1>
    <a href="index.html" class="btn">Back to Home</a>
</body>
</html>
